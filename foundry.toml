[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.fork]
# Mezo moved to the Osaka EVM; forked runs must execute its newer bytecode.
evm_version = "osaka"

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"

[fmt]
line_length = 100

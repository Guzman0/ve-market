name: Contract tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run tests
        run: forge test -vv
      - name: Fork test against Mezo testnet
        run: forge test --match-contract VeMarketForkTest -vv
        env:
          MEZO_RPC: https://rpc.test.mezo.org
